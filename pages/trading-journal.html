<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trading Journal - WealthFlow</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body {
      background-color: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #ff3b3b;
      margin: 0;
      padding: 0;
    }

    .container {
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(6px);
      padding: 2.5em;
      border-radius: 10px;
      margin: 3em auto;
      width: 90%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
      border: 1px solid #330000;
    }

    h1 {
      margin-bottom: 1.5em;
      color: #ff3b3b;
      text-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
      font-size: 1.8em;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1em;
      margin-bottom: 2em;
      text-align: left;
    }

    input[type="text"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 0.8em;
      border: 1px solid #330000;
      border-radius: 6px;
      background-color: #121212;
      color: #ffffff;
      font-size: 1em;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
      font-family: 'Segoe UI', sans-serif;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #ff3b3b;
      box-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input[type="file"] {
      color: #cccccc;
      cursor: pointer;
      padding: 0.6em;
    }

    input[type="file"]::file-selector-button {
      background: #ff3b3b;
      color: #000000;
      border: none;
      padding: 0.4em 0.8em;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.3s;
    }

    input[type="file"]::file-selector-button:hover {
      background: #cc0000;
    }

    .btn {
      display: block;
      width: 100%;
      background: #ff3b3b;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      padding: 0.8em 1.5em;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 0 5px rgba(255, 59, 59, 0.3);
      transition: background 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
      box-sizing: border-box;
      text-align: center;
      margin-top: 0.5em;
    }

    .btn:hover {
      background: #000000;
      color: #ff3b3b;
      border: 1px solid #ff3b3b;
      transform: scale(1.02);
      box-shadow: 0 0 10px #ff3b3b;
    }

    button.btn {
      margin-top: 0.5em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📒 One-Click Trading Journal</h1>
    <form>
      <input type="text" placeholder="Pair (e.g., EUR/USD)">
      <input type="text" placeholder="Timeframe">
      <input type="text" placeholder="Entry Price">
      <input type="text" placeholder="Stop Loss">
      <input type="text" placeholder="Take Profit">
      <input type="text" placeholder="Risk %">
      <textarea placeholder="Emotion / Notes (Optional)"></textarea>
      <input type="file" accept="image/*">
      <button type="submit" class="btn">Submit Trade</button>
    </form>
    <a href="../index.html" class="btn">⬅ Back to Home</a>
    <a href="trading-journal-dashboard.html" class="btn">🔢 View Dashboard</a>
  </div>
</body>
</html>
