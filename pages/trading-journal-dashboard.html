<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trading Journal Dashboard - WealthFlow</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body {
      background-color: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #ff3b3b;
      margin: 0;
      padding: 0;
    }

    .container {
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(6px);
      padding: 2.5em;
      border-radius: 10px;
      margin: 3em auto;
      width: 95%;
      max-width: 900px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
      border: 1px solid #330000;
    }

    h1 {
      margin-bottom: 1.2em;
      color: #ff3b3b;
      text-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
      font-size: 1.8em;
    }

    .summary {
      background: #121212;
      border: 1px solid #330000;
      border-radius: 8px;
      padding: 1.5em;
      margin-bottom: 2em;
      text-align: left;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }

    .summary h3 {
      margin-top: 0;
      color: #ff3b3b;
      font-size: 1.2em;
      margin-bottom: 1em;
    }

    .summary p {
      color: #cccccc;
      font-size: 1em;
      margin: 0.5em 0;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2em;
      background: #121212;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #330000;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }

    th, td {
      padding: 0.9em 0.8em;
      text-align: center;
      font-size: 0.95em;
    }

    th {
      background-color: #1a0000;
      color: #ff3b3b;
      font-weight: bold;
      border-bottom: 1px solid #330000;
    }

    td {
      color: #cccccc;
      border-bottom: 1px solid #220000;
    }

    tr:hover td {
      background-color: rgba(255, 59, 59, 0.05);
      color: #ffffff;
    }

    td a {
      color: #ff3b3b;
      text-decoration: none;
      font-weight: bold;
      transition: text-shadow 0.3s;
    }

    td a:hover {
      text-shadow: 0 0 8px #ff3b3b;
      text-decoration: underline;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 1em;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      width: 100%;
      max-width: 250px;
      background: #ff3b3b;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      padding: 0.8em 1.5em;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 0 5px rgba(255, 59, 59, 0.3);
      transition: background 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
      box-sizing: border-box;
      text-align: center;
    }

    .btn:hover {
      background: #000000;
      color: #ff3b3b;
      border: 1px solid #ff3b3b;
      transform: scale(1.02);
      box-shadow: 0 0 10px #ff3b3b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 Journal Dashboard</h1>

    <div class="summary">
      <h3>📊 Summary</h3>
      <p>✅ Win Rate: 63%</p>
      <p>📉 Avg Loss: -1.5%</p>
      <p>📈 Avg Gain: +2.2%</p>
      <p>📁 Total Trades: 48</p>
    </div>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Pair</th>
            <th>TF</th>
            <th>Entry</th>
            <th>SL</th>
            <th>TP</th>
            <th>Risk%</th>
            <th>Emotion</th>
            <th>Chart</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2025-07-28</td>
            <td>EUR/USD</td>
            <td>H1</td>
            <td>1.1050</td>
            <td>1.1000</td>
            <td>1.1150</td>
            <td>1%</td>
            <td>Calm</td>
            <td><a href="#">View</a></td>
          </tr>
          <tr>
            <td>2025-07-27</td>
            <td>GBP/JPY</td>
            <td>H4</td>
            <td>180.50</td>
            <td>179.00</td>
            <td>183.00</td>
            <td>1.5%</td>
            <td>Nervous</td>
            <td><a href="#">View</a></td>
          </tr>
          <!-- Add more trades here -->
        </tbody>
      </table>
    </div>

    <div class="btn-container">
      <a href="trading-journal.html" class="btn">⬅ Back to Journal</a>
      <a href="../index.html" class="btn">🏠 Home</a>
    </div>
  </div>
</body>
</html>
