<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧠 Habit Tracker - WealthFlow</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #ff3b3b;
    }

    .container {
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(6px);
      padding: 2.5em;
      border-radius: 10px;
      margin: 4em auto;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
      border: 1px solid #330000;
    }

    h1 {
      text-align: center;
      color: #ff3b3b;
      text-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
      margin-bottom: 1.5em;
      font-size: 1.8em;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 2em 0;
    }

    li {
      background: #121212;
      border: 1px solid #330000;
      padding: 1em 1.2em;
      margin-bottom: 0.8em;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    li:hover {
      border-color: #ff3b3b;
      box-shadow: 0 0 8px rgba(255, 59, 59, 0.3);
    }

    label {
      display: flex;
      align-items: center;
      cursor: pointer;
      color: #cccccc;
      font-size: 1.05em;
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #ff3b3b;
      border-radius: 4px;
      margin-right: 15px;
      background: #0a0a0a;
      cursor: pointer;
      position: relative;
      transition: background 0.3s, box-shadow 0.3s;
    }

    input[type="checkbox"]:checked {
      background: #ff3b3b;
      box-shadow: 0 0 8px rgba(255, 59, 59, 0.6);
    }

    input[type="checkbox"]:checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-size: 12px;
      font-weight: bold;
    }

    input[type="checkbox"]:checked + span,
    li:has(input[type="checkbox"]:checked) label {
      color: #ffffff;
    }

    .bottom-buttons {
      display: flex;
      flex-direction: column;
      gap: 1em;
      text-align: center;
    }

    .btn {
      display: block;
      background: #ff3b3b;
      color: #000000;
      text-decoration: none;
      padding: 0.8em 1.5em;
      border-radius: 5px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 0 5px rgba(255, 59, 59, 0.3);
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
      font-size: 1em;
    }

    .btn:hover {
      background: #000000;
      color: #ff3b3b;
      border: 1px solid #ff3b3b;
      transform: scale(1.02);
      box-shadow: 0 0 10px #ff3b3b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Daily Trading Habit Tracker</h1>
    <ul id="habitList">
      <li>
        <label><input type="checkbox" data-id="1"> Reviewed market news 📰</label>
      </li>
      <li>
        <label><input type="checkbox" data-id="2"> Updated trading journal 📒</label>
      </li>
      <li>
        <label><input type="checkbox" data-id="3"> Analyzed yesterday’s trades 📊</label>
      </li>
      <li>
        <label><input type="checkbox" data-id="4"> Checked economic calendar 📆</label>
      </li>
      <li>
        <label><input type="checkbox" data-id="5"> Meditated / Controlled mindset 🧘</label>
      </li>
      <li>
        <label><input type="checkbox" data-id="6"> Reviewed trade setup plans 💼</label>
      </li>
    </ul>

    <div class="bottom-buttons">
      <button class="btn" onclick="resetHabits()">Reset for Today 🔄</button>
      <a href="../index.html" class="btn">⬅ Back to Home</a>
    </div>
  </div>

  <script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const savedHabits = JSON.parse(localStorage.getItem('tradingHabits')) || {};

    checkboxes.forEach(cb => {
      if (savedHabits[cb.dataset.id]) cb.checked = true;
      cb.addEventListener('change', () => {
        savedHabits[cb.dataset.id] = cb.checked;
        localStorage.setItem('tradingHabits', JSON.stringify(savedHabits));
      });
    });

    function resetHabits() {
      checkboxes.forEach(cb => cb.checked = false);
      localStorage.removeItem('tradingHabits');
    }
  </script>
</body>
</html>
