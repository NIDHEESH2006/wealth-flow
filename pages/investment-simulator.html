<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Investment Simulator - WealthFlow</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body {
      background-color: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #ff3b3b;
      margin: 0;
      padding: 0;
    }

    .container {
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(6px);
      padding: 2.5em;
      border-radius: 10px;
      margin: 4em auto;
      width: 90%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
      border: 1px solid #330000;
    }

    h1 {
      margin-bottom: 1.5em;
      color: #ff3b3b;
      text-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
      font-size: 1.8em;
    }

    .simulator {
      text-align: left;
      margin-top: 1.5em;
    }

    .simulator label {
      display: block;
      margin-top: 1em;
      color: #cccccc;
      font-weight: bold;
      font-size: 0.95em;
    }

    select, input {
      width: 100%;
      padding: 0.8em;
      margin-top: 0.5em;
      border: 1px solid #330000;
      border-radius: 6px;
      background-color: #121212;
      color: #ffffff;
      font-size: 1em;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #ff3b3b;
      box-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
    }

    .btn {
      display: block;
      width: 100%;
      background: #ff3b3b;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      padding: 0.8em 1.5em;
      margin-top: 1.5em;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 0 5px rgba(255, 59, 59, 0.3);
      transition: background 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
      box-sizing: border-box;
      text-align: center;
    }

    .btn:hover {
      background: #000000;
      color: #ff3b3b;
      border: 1px solid #ff3b3b;
      transform: scale(1.02);
      box-shadow: 0 0 10px #ff3b3b;
    }

    .result {
      margin-top: 2em;
      padding: 1em;
      background-color: #121212;
      border: 1px solid #330000;
      border-radius: 8px;
      color: #ff3b3b;
      font-size: 1.1em;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.15);
      text-align: center;
    }

    .result h3 {
      margin: 0;
      color: #ff3b3b;
      text-shadow: 0 0 6px rgba(255, 59, 59, 0.3);
    }

    a.btn {
      margin-top: 2em;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Investment Simulator</h1>
    <div class="simulator">
      <label for="type">Investment Type:</label>
      <select id="type">
        <option value="sip">SIP</option>
        <option value="lumpsum">Lumpsum</option>
      </select>

      <label for="amount">Amount (₹):</label>
      <input type="number" id="amount" placeholder="Enter amount">

      <label for="rate">Expected Annual Return (%):</label>
      <input type="number" id="rate" placeholder="e.g. 12">

      <label for="years">Years:</label>
      <input type="number" id="years" placeholder="e.g. 10">

      <button class="btn" onclick="simulateInvestment()">Simulate</button>

      <div id="output" class="result"></div>
    </div>
    <a href="../index.html" class="btn">⬅ Back to Home</a>
  </div>

  <script>
    function simulateInvestment() {
      const type = document.getElementById('type').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const rate = parseFloat(document.getElementById('rate').value) / 100;
      const years = parseInt(document.getElementById('years').value);
      let result = 0;

      if (isNaN(amount) || isNaN(rate) || isNaN(years)) {
        document.getElementById('output').innerHTML = `<h3 style="color: #ff6b6b;">⚠️ Please fill in all fields correctly.</h3>`;
        return;
      }

      if (type === 'sip') {
        // SIP Formula
        const months = years * 12;
        const monthlyRate = rate / 12;
        result = amount * (((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate) * (1 + monthlyRate));
      } else {
        // Lumpsum Formula
        result = amount * Math.pow(1 + rate, years);
      }

      document.getElementById('output').innerHTML = `<h3>💰 Future Value: ₹${result.toLocaleString('en-IN', {maximumFractionDigits: 2})}</h3>`;
    }
  </script>
</body>
</html>
