<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧪 Finance Persona Quiz - WealthFlow</title>
  <style>
    /* Background & general font */
    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', sans-serif;
      color: #ff3b3b;
      margin: 0;
      padding: 0;
    }

    /* Quiz container */
    .container {
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(6px);
      padding: 2.5em;
      border-radius: 10px;
      margin: 4em auto;
      width: 90%;
      max-width: 700px;
      text-align: center;
      border: 1px solid #330000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
    }

    /* Heading */
    h1 {
      margin-bottom: 1.5em;
      color: #ff3b3b;
      text-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
      font-size: 1.8em;
    }

    /* Question text */
    .question {
      margin-bottom: 1.5em;
      text-align: left;
      background: #121212;
      border: 1px solid #330000;
      padding: 1.2em;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }

    .question-text {
      font-weight: bold;
      margin-bottom: 0.8em;
      color: #ffffff;
      font-size: 1.05em;
    }

    /* Options layout */
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6em;
    }

    .option-item {
      background: rgba(255, 59, 59, 0.05);
      padding: 0.6em 0.8em;
      border-radius: 6px;
      border: 1px solid #330000;
      cursor: pointer;
      color: #cccccc;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
    }

    .option-item:hover {
      background: rgba(255, 59, 59, 0.15);
      border-color: #ff3b3b;
      color: #ffffff;
    }

    .option-item input {
      margin-right: 0.8em;
      accent-color: #ff3b3b;
      cursor: pointer;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      max-width: 350px;
      background: #ff3b3b;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      padding: 0.8em 1.5em;
      margin: 1.5em auto 0 auto;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 0 5px rgba(255, 59, 59, 0.3);
      transition: background 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
      box-sizing: border-box;
      text-align: center;
    }

    .btn:hover {
      background: #000000;
      color: #ff3b3b;
      border: 1px solid #ff3b3b;
      transform: scale(1.02);
      box-shadow: 0 0 10px #ff3b3b;
    }

    .btn:disabled {
      background: #333333;
      color: #777777;
      border: 1px solid #444444;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Result text */
    .result {
      font-size: 1.2em;
      margin-top: 1.5em;
      font-weight: bold;
      color: #ff3b3b;
      text-shadow: 0 0 6px rgba(255, 59, 59, 0.3);
    }

    p {
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div class="container" id="quiz-container">
    <h1>🧪 Daily Financial Quiz</h1>
    <form id="quiz-form"></form>
    <div class="result" id="result"></div>
    <a href="../index.html" class="btn">⬅ Back to Home</a>
  </div>

  <script>
    const today = new Date().toISOString().slice(0, 10);
    const hasPlayed = localStorage.getItem('quizDate') === today;

    const questions = [
      { q: "1. What does ROI stand for in finance?", options: ["Rate of Interest", "Return on Investment", "Risk of Investment", "Revenue on Income"], answer: "Return on Investment" },
      { q: "2. A stock split increases:", options: ["Share price", "Number of shares", "Company profit", "Dividend"], answer: "Number of shares" },
      { q: "3. Diversification reduces:", options: ["Returns", "Expenses", "Risk", "Assets"], answer: "Risk" },
      { q: "4. What is a bullish market?", options: ["Market going down", "Market going sideways", "Market going up", "Currency falling"], answer: "Market going up" },
      { q: "5. Which is NOT a fixed income investment?", options: ["Bond", "FD", "Stock", "PPF"], answer: "Stock" }
    ];

    const quizForm = document.getElementById("quiz-form");
    const result = document.getElementById("result");

    if (hasPlayed) {
      quizForm.innerHTML = "<p>You already completed today's quiz. Come back tomorrow! ✅</p>";
    } else {
      questions.forEach((q, index) => {
        const div = document.createElement("div");
        div.classList.add("question");
        div.innerHTML = `
          <p class="question-text">${q.q}</p>
          <div class="options">
            ${q.options.map(opt => `
              <label class="option-item">
                <input type="radio" name="q${index}" value="${opt}"> ${opt}
              </label>
            `).join('')}
          </div>
        `;
        quizForm.appendChild(div);
      });

      const submitBtn = document.createElement("button");
      submitBtn.textContent = "Submit Quiz";
      submitBtn.className = "btn";
      submitBtn.type = "button";
      submitBtn.onclick = checkAnswers;
      quizForm.appendChild(submitBtn);
    }

    function checkAnswers() {
      let score = 0;
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && selected.value === q.answer) {
          score++;
        }
      });

      result.textContent = `🎯 You got ${score} out of ${questions.length} correct!`;
      localStorage.setItem('quizDate', today);
      const submitButton = document.querySelector("#quiz-form button");
      if(submitButton) submitButton.disabled = true;
    }
  </script>
</body>
</html>
